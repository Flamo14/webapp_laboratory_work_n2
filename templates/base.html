{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17142d">
  <title>{% block title %}Welcome{% endblock %} · Northstar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/auth.css' %}">
  <script src="{% static 'js/auth.js' %}" defer></script>
</head>
<body>
  <div class="scene-backdrop" aria-hidden="true">
    <span class="backdrop-orb backdrop-orb--one"></span>
    <span class="backdrop-orb backdrop-orb--two"></span>
    <span class="backdrop-orb backdrop-orb--three"></span>
    <span class="backdrop-grid"></span>
  </div>
  <div class="pointer-aura" aria-hidden="true"></div>
  <main class="page-shell">
    <a class="brand" href="{% url 'dashboard' %}" aria-label="Northstar home">
      <span class="brand-mark" aria-hidden="true">N</span>
      <span>northstar</span>
    </a>

    {% if messages %}
      <div class="messages" aria-live="polite">
        {% for message in messages %}
          <p class="message message--{{ message.tags }}">{{ message }}</p>
        {% endfor %}
      </div>
    {% endif %}

    {% block content %}{% endblock %}
    <footer class="page-footer">© <span data-current-year></span> Northstar <span aria-hidden="true">✦</span> A clearer way forward.</footer>
  </main>
</body>
</html>
